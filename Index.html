<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тюнер & Метроном</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --bg-0: #080a12;
        --bg-1: #0f1220;
        --bg-2: #161a2c;
        --surface: rgba(255, 255, 255, 0.045);
        --surface-2: rgba(255, 255, 255, 0.075);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.16);
        --text: #f0f2fa;
        --text-2: #9aa3c4;
        --text-3: #626a8a;
        --accent: #6b8fff;
        --accent-2: #8b6bff;
        --success: #35d07f;
        --warning: #ffb340;
        --danger: #ff4d5e;
        --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
        --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.35);
        --shadow-glow: 0 0 40px rgba(107, 143, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at 20% 0%, #1a1f3a 0%, transparent 50%),
                    radial-gradient(circle at 80% 100%, #2a1f3a 0%, transparent 50%),
                    linear-gradient(160deg, var(--bg-0), var(--bg-1));
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow-x: hidden;
        position: relative;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* Атмосферное свечение на фоне */
    body::before,
    body::after {
        content: '';
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.35;
        pointer-events: none;
        z-index: 0;
    }
    body::before {
        width: 400px; height: 400px;
        background: radial-gradient(circle, #4d7efc, transparent 70%);
        top: -100px; left: -100px;
    }
    body::after {
        width: 420px; height: 420px;
        background: radial-gradient(circle, #8b6bff, transparent 70%);
        bottom: -120px; right: -120px;
    }

    /* Звёзды */
    .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
    }
    .star {
        position: absolute;
        width: 2px; height: 2px;
        background: #fff;
        border-radius: 50%;
        opacity: 0;
        animation: twinkle 6s infinite ease-in-out;
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 0.9; transform: scale(1.2); }
    }

    /* Контейнер приложения */
    .app {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 420px;
        background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
        backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
        border: 1px solid var(--border);
        border-radius: 32px;
        padding: 28px 24px 32px;
        box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* Шапка */
    .header {
        text-align: center;
        margin-bottom: 22px;
    }
    .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.4px;
        background: linear-gradient(135deg, #fff, #b8c4ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .logo-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px; height: 34px;
        border-radius: 11px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 6px 18px rgba(107, 143, 255, 0.4);
        font-size: 17px;
    }
    .subtitle {
        color: var(--text-3);
        font-size: 12.5px;
        margin-top: 4px;
        letter-spacing: 0.2px;
    }

    /* Переключатель вкладок (сегментированный контроль) */
    .tabs {
        display: flex;
        position: relative;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 5px;
        margin-bottom: 24px;
        isolation: isolate;
    }
    .tabs .indicator {
        position: absolute;
        top: 5px;
        left: 5px;
        width: calc(50% - 5px);
        height: calc(100% - 10px);
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-radius: 12px;
        transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1);
        box-shadow: 0 6px 18px rgba(107, 143, 255, 0.4);
        z-index: -1;
    }
    .tabs[data-active="metronome"] .indicator {
        transform: translateX(100%);
    }
    .tab {
        flex: 1;
        padding: 11px 0;
        background: transparent;
        border: none;
        color: var(--text-2);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: color 0.3s;
        border-radius: 12px;
        letter-spacing: 0.1px;
    }
    .tab.active { color: #fff; }

    /* Панели */
    .panel {
        display: none;
        animation: fadeIn 0.45s ease-out;
    }
    .panel.active { display: block; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ================ ТЮНЕР ================ */
    .tuner {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .note-readout {
        text-align: center;
        margin-bottom: 4px;
        min-height: 84px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .note-name {
        font-size: 62px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -3px;
        background: linear-gradient(180deg, #ffffff, #a8b0d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        transition: background 0.25s, filter 0.25s;
        font-variant-numeric: tabular-nums;
    }
    .note-name.in-tune {
        background: linear-gradient(180deg, #6bffa8, #35d07f);
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 0 20px rgba(53, 208, 127, 0.5));
    }
    .note-name.idle {
        background: linear-gradient(180deg, #ffffff, #6a7299);
        -webkit-background-clip: text;
        background-clip: text;
        opacity: 0.7;
    }

    .note-sub {
        font-size: 13px;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.3px;
        margin-top: 8px;
        transition: color 0.25s;
    }
    .note-sub.in-tune { color: var(--success); }

    /* Индикатор "верно" */
    .in-tune-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        background: rgba(53, 208, 127, 0.14);
        color: var(--success);
        border: 1px solid rgba(53, 208, 127, 0.3);
        margin-top: 10px;
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity 0.25s, transform 0.25s;
        pointer-events: none;
    }
    .in-tune-badge.visible {
        opacity: 1;
        transform: translateY(0);
    }

    /* Шкала тюнера */
    .dial-wrap {
        position: relative;
        width: 240px;
        height: 150px;
        margin: 26px 0 22px;
    }

    /* Подпись "ниже/выше" */
    .dial-hint {
        position: absolute;
        bottom: -4px;
        font-size: 11px;
        color: var(--text-3);
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    .dial-hint.left  { left: 0; }
    .dial-hint.right { right: 0; }

    .dial {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50% / 100% 100% 0 0;
        overflow: hidden;
        background:
            conic-gradient(from 180deg at 50% 100%,
                transparent 0deg 118deg,
                var(--danger)  118deg 138deg,
                var(--warning) 138deg 165deg,
                var(--success) 165deg 195deg,
                var(--warning) 195deg 222deg,
                var(--danger)  222deg 242deg,
                transparent 242deg 360deg
            );
        box-shadow:
            inset 0 0 30px rgba(0, 0, 0, 0.7),
            inset 0 0 0 1px rgba(255, 255, 255, 0.05),
            0 10px 30px rgba(0, 0, 0, 0.4);
    }
    /* Маска, чтобы цветная дуга была тоньше */
    .dial::before {
        content: '';
        position: absolute;
        inset: 34px 26px 0;
        background: linear-gradient(180deg, rgba(15,18,32,0.95), rgba(15,18,32,0.75));
        border-radius: 50% / 100% 100% 0 0;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        border-top: 1px solid rgba(255,255,255,0.06);
    }

    /* Деления */
    .ticks {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    .tick {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 1.5px;
        height: 8px;
        background: rgba(255, 255, 255, 0.18);
        transform-origin: bottom center;
        border-radius: 1px;
    }
    .tick.major {
        height: 13px;
        background: rgba(255, 255, 255, 0.35);
    }

    .needle {
        position: absolute;
        bottom: 10px;
        left: 50%;
        width: 2.5px;
        height: 72px;
        background: var(--danger);
        transform-origin: bottom center;
        transform: translateX(-50%) rotate(0deg);
        transition: transform 0.07s linear, background 0.2s, box-shadow 0.2s;
        z-index: 2;
        border-radius: 2px 2px 0 0;
        box-shadow: 0 0 10px currentColor;
        will-change: transform;
    }
    .needle::after {
        content: '';
        position: absolute;
        top: -3px;
        left: 50%;
        width: 8px; height: 8px;
        background: inherit;
        border-radius: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 8px currentColor;
    }
    .needle.in-tune {
        background: var(--success);
        box-shadow: 0 0 16px var(--success);
    }

    .hub {
        position: absolute;
        bottom: 6px;
        left: 50%;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #556, #1a1d2b);
        border: 2px solid rgba(255, 255, 255, 0.15);
        transform: translateX(-50%);
        z-index: 3;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
    }

    /* Статус микрофона */
    .mic-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-2);
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        user-select: none;
    }
    .mic-btn:hover {
        background: var(--surface-2);
        color: var(--text);
        transform: translateY(-1px);
    }
    .mic-btn.on {
        background: rgba(53, 208, 127, 0.1);
        border-color: rgba(53, 208, 127, 0.3);
        color: var(--success);
    }
    .mic-dot {
        width: 9px; height: 9px;
        border-radius: 50%;
        background: var(--text-3);
        transition: background 0.25s;
        position: relative;
    }
    .mic-btn.on .mic-dot {
        background: var(--success);
        box-shadow: 0 0 12px var(--success);
    }
    .mic-btn.on .mic-dot::after {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 1.5px solid var(--success);
        animation: ripple 1.6s infinite;
    }
    @keyframes ripple {
        0% { transform: scale(0.8); opacity: 1; }
        100% { transform: scale(2); opacity: 0; }
    }

    /* ================ МЕТРОНОМ ================ */
    .metronome {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
    }

    /* BPM дисплей + тап */
    .bpm-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        width: 100%;
        align-items: stretch;
    }

    .bpm-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: border-color 0.25s;
    }
    .bpm-box:focus-within { border-color: var(--accent); }

    .bpm-stepper {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .bpm-stepper button {
        width: 22px; height: 22px;
        border-radius: 7px;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border);
        color: var(--text-2);
        font-size: 11px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        font-family: inherit;
    }
    .bpm-stepper button:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
    }
    .bpm-stepper button:active { transform: scale(0.9); }

    .bpm-value {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
    }
    .bpm-input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: inherit;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -1px;
        font-variant-numeric: tabular-nums;
        appearance: textfield;
        -moz-appearance: textfield;
        padding: 0;
        line-height: 1;
    }
    .bpm-input::-webkit-inner-spin-button,
    .bpm-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    .bpm-label {
        font-size: 11px;
        color: var(--text-3);
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .tap-btn {
        width: 78px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        color: var(--text-2);
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        user-select: none;
        touch-action: manipulation;
    }
    .tap-btn:hover { background: var(--surface-2); color: var(--text); }
    .tap-btn.pressed {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #fff;
        transform: scale(0.96);
        box-shadow: 0 8px 24px rgba(107, 143, 255, 0.4);
    }

    /* Круг-пульс */
    .pulse-stage {
        position: relative;
        width: 100%;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 4px 0;
    }

    .pulse-ring {
        position: absolute;
        width: 120px; height: 120px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        opacity: 0;
        pointer-events: none;
    }
    .pulse-ring.fire {
        animation: pulseRing 0.7s ease-out;
    }
    @keyframes pulseRing {
        0% { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(1.6); opacity: 0; }
    }

    .pulse-circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #7d9cff, var(--accent) 60%, #4a5fd6);
        box-shadow:
            0 0 0 1px rgba(255,255,255,0.15),
            0 20px 40px rgba(107, 143, 255, 0.35),
            inset 0 -8px 20px rgba(0, 0, 0, 0.25);
        transition: transform 0.09s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .pulse-circle::before {
        content: '';
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), transparent 60%);
    }
    .pulse-circle.beat {
        transform: scale(1.12);
        box-shadow:
            0 0 0 1px rgba(255,255,255,0.2),
            0 0 40px rgba(107, 143, 255, 0.7),
            0 0 80px rgba(107, 143, 255, 0.4),
            inset 0 -8px 20px rgba(0, 0, 0, 0.25);
    }

    /* Кнопки управления метрономом */
    .controls-row {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .play-btn {
        width: 68px; height: 68px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
            0 12px 28px rgba(107, 143, 255, 0.45),
            inset 0 1px 0 rgba(255, 255, 255, 0.25);
        transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
        font-family: inherit;
    }
    .play-btn:hover { transform: translateY(-2px); }
    .play-btn:active { transform: scale(0.94); }
    .play-btn.playing {
        background: linear-gradient(135deg, #ff5c6d, #d63a4a);
        box-shadow:
            0 12px 28px rgba(255, 77, 94, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.25);
        animation: pulseBtn 2s infinite;
    }
    @keyframes pulseBtn {
        0%, 100% { box-shadow: 0 12px 28px rgba(255, 77, 94, 0.5), inset 0 1px 0 rgba(255,255,255,0.25); }
        50% { box-shadow: 0 12px 40px rgba(255, 77, 94, 0.8), inset 0 1px 0 rgba(255,255,255,0.25); }
    }

    .icon-btn {
        width: 46px; height: 46px;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-2);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        font-family: inherit;
    }
    .icon-btn:hover {
        background: var(--surface-2);
        color: var(--text);
        transform: translateY(-1px);
    }
    .icon-btn.muted {
        background: rgba(255, 77, 94, 0.1);
        border-color: rgba(255, 77, 94, 0.35);
        color: var(--danger);
    }

    /* ================ СТРИК ================ */
    .streak {
        margin-top: 24px;
        padding-top: 22px;
        border-top: 1px solid var(--border);
    }
    .streak-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
    }
    .streak-title {
        font-size: 12px;
        color: var(--text-3);
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
    }
    .streak-count {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
    }
    .streak-count span { color: var(--warning); }

    .flies {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
    }
    .fly {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        position: relative;
        overflow: hidden;
        transition: background 0.3s;
    }
    .fly.on {
        background: linear-gradient(90deg, var(--warning), #ff8a3d);
        box-shadow: 0 0 12px rgba(255, 179, 64, 0.5);
    }
    .fly.on::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        animation: shimmer 2.4s infinite;
    }
    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        margin-bottom: 10px;
        font-size: 13.5px;
        color: var(--text-2);
    }

    .switch {
        position: relative;
        width: 44px; height: 24px;
        -webkit-appearance: none;
        appearance: none;
        outline: none;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        transition: 0.3s;
        cursor: pointer;
        flex-shrink: 0;
    }
    .switch::before {
        content: '';
        position: absolute;
        top: 2px; left: 2px;
        width: 16px; height: 16px;
        border-radius: 50%;
        background: var(--text-2);
        transition: 0.3s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .switch:checked {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
    }
    .switch:checked::before {
        left: calc(100% - 18px);
        background: #fff;
    }

    .skin-btn {
        padding: 7px 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .skin-btn:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
    }

    .reset-btn {
        width: 100%;
        padding: 11px;
        background: rgba(255, 77, 94, 0.06);
        color: var(--danger);
        border: 1px solid rgba(255, 77, 94, 0.2);
        border-radius: 14px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 0.2px;
    }
    .reset-btn:hover {
        background: rgba(255, 77, 94, 0.14);
        border-color: rgba(255, 77, 94, 0.4);
    }

    /* Скрываем лишние overflow на мобилках */
    @media (max-width: 400px) {
        .note-name { font-size: 54px; }
        .app { padding: 24px 20px 26px; }
        .dial-wrap { width: 220px; height: 138px; }
    }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="app">
    <div class="header">
        <div class="logo">
            <span class="logo-badge">♪</span>
            <span>Тюнер & Метроном</span>
        </div>
        <div class="subtitle">Инструмент для ежедневной практики</div>
    </div>

    <div class="tabs" id="tabs" data-active="tuner">
        <div class="indicator"></div>
        <button class="tab active" data-tab="tuner">Тюнер</button>
        <button class="tab" data-tab="metronome">Метроном</button>
    </div>

    <!-- ============ ТЮНЕР ============ -->
    <div class="panel active" id="tunerPanel">
        <div class="tuner">
            <div class="note-readout">
                <div class="note-name idle" id="noteName">—</div>
                <div class="note-sub" id="noteSub">Нажмите на микрофон, чтобы начать</div>
                <div class="in-tune-badge" id="inTuneBadge">✓ Верно</div>
            </div>

            <div class="dial-wrap">
                <span class="dial-hint left">♭ ниже</span>
                <span class="dial-hint right">выше ♯</span>

                <div class="dial">
                    <div class="ticks" id="ticks"></div>
                </div>

                <div class="needle" id="needle"></div>
                <div class="hub"></div>
            </div>

            <button class="mic-btn" id="micBtn">
                <span class="mic-dot"></span>
                <span id="micText">Микрофон выкл</span>
            </button>
        </div>
    </div>

    <!-- ============ МЕТРОНОМ ============ -->
    <div class="panel" id="metronomePanel">
        <div class="metronome">
            <div class="bpm-row">
                <div class="bpm-box">
                    <div class="bpm-stepper">
                        <button id="bpmUp">▲</button>
                        <button id="bpmDown">▼</button>
                    </div>
                    <div class="bpm-value">
                        <span class="bpm-label">BPM</span>
                        <input class="bpm-input" id="bpmInput" type="number" value="120" min="40" max="240">
                    </div>
                </div>
                <button class="tap-btn" id="tapBtn">TAP</button>
            </div>

            <div class="pulse-stage">
                <div class="pulse-ring" id="pulseRing"></div>
                <div class="pulse-circle" id="pulseCircle"></div>
            </div>

            <div class="controls-row">
                <button class="icon-btn" id="muteBtn" title="Звук">🔊</button>
                <button class="play-btn" id="playBtn">▶</button>
                <button class="icon-btn" id="skinBtn" title="Скин">🎨</button>
            </div>
        </div>

        <div class="streak">
            <div class="streak-head">
                <span class="streak-title">Дней подряд</span>
                <span class="streak-count"><span id="streakCount">0</span> / 7</span>
            </div>
            <div class="flies" id="flies"></div>

            <div class="setting-row">
                <span>Система дней подряд</span>
                <input type="checkbox" class="switch" id="streakToggle" checked>
            </div>
            <button class="reset-btn" id="resetStreak">Сбросить серию</button>
        </div>
    </div>
</div>

<script>
/* ==================== ОБЩЕЕ ==================== */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

/* ==================== МЕТРОНОМ ==================== */
let metroTimer = null;
let isPlaying = false;
let isMuted = false;
let currentBpm = 120;
let lastTap = 0;
let tapHistory = [];

const BPM_MIN = 40, BPM_MAX = 240;
const SKINS = ['#6b8fff', '#ffb340', '#35d07f', '#8b6bff', '#ff4d5e', '#22d3ee'];
let skinIdx = 0;

const $ = id => document.getElementById(id);

const bpmInput   = $('bpmInput');
const bpmUp      = $('bpmUp');
const bpmDown    = $('bpmDown');
const tapBtn     = $('tapBtn');
const playBtn    = $('playBtn');
const muteBtn    = $('muteBtn');
const skinBtn    = $('skinBtn');
const pulseCircle= $('pulseCircle');
const pulseRing  = $('pulseRing');
const streakToggle = $('streakToggle');
const resetStreak = $('resetStreak');
const streakCount = $('streakCount');
const fliesEl    = $('flies');

/* --- Звук клика --- */
function click(freq = 1100, gain = 0.28) {
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + 0.06);
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(gain, audioCtx.currentTime + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
    osc.connect(g).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

function beat() {
    // Визуальный удар
    pulseCircle.classList.add('beat');
    setTimeout(() => pulseCircle.classList.remove('beat'), 90);

    // Кольцо
    pulseRing.classList.remove('fire');
    void pulseRing.offsetWidth;
    pulseRing.classList.add('fire');

    if (!isMuted) click();
}

function startMetro() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    stopMetro();
    beat();
    metroTimer = setInterval(beat, 60000 / currentBpm);
    isPlaying = true;
    playBtn.textContent = '❚❚';
    playBtn.classList.add('playing');
}

function stopMetro() {
    if (metroTimer) clearInterval(metroTimer);
    metroTimer = null;
    isPlaying = false;
    playBtn.textContent = '▶';
    playBtn.classList.remove('playing');
}

function restartIfPlaying() {
    if (isPlaying) startMetro();
}

playBtn.addEventListener('click', () => {
    if (isPlaying) stopMetro(); else startMetro();
});

muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
    muteBtn.classList.toggle('muted', isMuted);
});

function setBpm(v, updateInput = true) {
    v = Math.round(v);
    if (v < BPM_MIN) v = BPM_MIN;
    if (v > BPM_MAX) v = BPM_MAX;
    currentBpm = v;
    if (updateInput) bpmInput.value = v;
    localStorage.setItem('musicToolBPM', v);
    restartIfPlaying();
}

bpmUp.addEventListener('click', () => setBpm(currentBpm + 1));
bpmDown.addEventListener('click', () => setBpm(currentBpm - 1));

bpmInput.addEventListener('input', () => {
    const v = parseInt(bpmInput.value);
    if (!isNaN(v) && v >= BPM_MIN && v <= BPM_MAX) {
        currentBpm = v;
        localStorage.setItem('musicToolBPM', v);
    }
});
bpmInput.addEventListener('change', () => {
    let v = parseInt(bpmInput.value);
    if (isNaN(v)) v = currentBpm;
    setBpm(v);
});

/* --- Tap Tempo --- */
tapBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    tapBtn.classList.add('pressed');

    const now = performance.now();
    if (lastTap) {
        const dt = now - lastTap;
        if (dt > 200 && dt < 2000) {
            tapHistory.push(dt);
            if (tapHistory.length > 6) tapHistory.shift();
            const avg = tapHistory.reduce((a,b)=>a+b,0) / tapHistory.length;
            const bpm = 60000 / avg;
            setBpm(bpm);
        } else {
            tapHistory = [];
        }
    }
    lastTap = now;
});

const releaseTap = () => tapBtn.classList.remove('pressed');
tapBtn.addEventListener('pointerup', releaseTap);
tapBtn.addEventListener('pointerleave', releaseTap);
tapBtn.addEventListener('pointercancel', releaseTap);

/* --- Смена скина --- */
skinBtn.addEventListener('click', () => {
    skinIdx = (skinIdx + 1) % SKINS.length;
    const c = SKINS[skinIdx];
    pulseCircle.style.background =
        `radial-gradient(circle at 35% 30%, ${lighten(c, 25)}, ${c} 60%, ${darken(c, 20)})`;
    pulseRing.style.borderColor = c;
    localStorage.setItem('musicToolSkin', skinIdx);
});

function hexToRgb(h) {
    h = h.replace('#','');
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
}
function lighten(hex, amt) {
    const [r,g,b] = hexToRgb(hex);
    return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}
function darken(hex, amt) {
    const [r,g,b] = hexToRgb(hex);
    return `rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;
}

/* ==================== СТРИК ==================== */
function renderStreak(count) {
    streakCount.textContent = count;
    fliesEl.innerHTML = '';
    for (let i = 0; i < 7; i++) {
        const f = document.createElement('div');
        f.className = 'fly' + (i < count ? ' on' : '');
        fliesEl.appendChild(f);
    }
}

function loadStreak() {
    const today = new Date().toDateString();
    const lastVisit = localStorage.getItem('musicToolLastVisit');
    let count = parseInt(localStorage.getItem('musicToolStreak')) || 0;
    const enabled = streakToggle.checked;

    if (!enabled) { renderStreak(0); return; }

    if (lastVisit === today) {
        renderStreak(count);
        return;
    }

    if (lastVisit) {
        const lastD = new Date(lastVisit);
        const yest = new Date();
        yest.setDate(yest.getDate() - 1);
        yest.setHours(0,0,0,0);
        if (lastD >= yest) count++;
        else count = 1;
    } else {
        count = 1;
    }

    localStorage.setItem('musicToolLastVisit', today);
    localStorage.setItem('musicToolStreak', count);
    renderStreak(count);
}

streakToggle.addEventListener('change', () => {
    localStorage.setItem('musicToolStreakSetting', streakToggle.checked);
    loadStreak();
});

resetStreak.addEventListener('click', () => {
    if (confirm('Сбросить серию дней подряд?')) {
        localStorage.removeItem('musicToolStreak');
        localStorage.removeItem('musicToolLastVisit');
        renderStreak(0);
    }
});

/* ==================== ТЮНЕР ==================== */
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const IN_TUNE_CENTS = 10;
const DEG_PER_CENT  = 0.9;

let tunerStream = null, tunerSrc = null, tunerAn = null, tunerBuf = null, tunerRaf = null;
let tunerOn = false, needleAngle = 0, lastAnalysis = 0;

const noteName  = $('noteName');
const noteSub   = $('noteSub');
const inTuneBadge = $('inTuneBadge');
const needle    = $('needle');
const micBtn    = $('micBtn');
const micText   = $('micText');

/* Деления на шкале */
(function buildTicks() {
    const container = $('ticks');
    for (let i = -5; i <= 5; i++) {
        const angle = i * 9; // -45°..+45°
        const t = document.createElement('div');
        t.className = 'tick' + (i === 0 || Math.abs(i) === 5 ? ' major' : '');
        t.style.transform = `translateX(-50%) rotate(${angle}deg)`;
        // Сдвигаем начало деления к верхнему краю дуги
        t.style.bottom = '78px';
        t.style.height = (Math.abs(i) === 0 ? 13 : (Math.abs(i) === 5 ? 13 : 8)) + 'px';
        container.appendChild(t);
    }
})();

function noteFromPitch(freq) {
    const n = 12 * Math.log2(freq / 440) + 69;
    const r = Math.round(n);
    const cents = (n - r) * 100;
    const name = NOTES[((r % 12) + 12) % 12];
    const oct = Math.floor(r / 12) - 1;
    return { label: name + oct, cents, midi: r };
}

function rms(buf) {
    let s = 0;
    for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    return Math.sqrt(s / buf.length);
}

function autoCorrelate(buf, sr) {
    let size = buf.length;
    let r1 = 0, r2 = size - 1;
    const th = 0.2;
    for (let i = 0; i < size/2; i++) if (Math.abs(buf[i]) < th) { r1 = i; break; }
    for (let i = 1; i < size/2; i++) if (Math.abs(buf[size-i]) < th) { r2 = size-i; break; }
    const t = buf.slice(r1, r2);
    size = t.length;
    if (size < 64) return -1;

    const c = new Float32Array(size);
    for (let i = 0; i < size; i++) {
        let s = 0;
        for (let j = 0; j < size - i; j++) s += t[j] * t[j+i];
        c[i] = s;
    }
    let d = 0;
    while (d < size-1 && c[d] > c[d+1]) d++;
    let mx = -1, pos = -1;
    for (let i = d; i < size; i++) if (c[i] > mx) { mx = c[i]; pos = i; }
    if (pos <= 0) return -1;

    let T0 = pos;
    const x1 = c[T0-1] || 0, x2 = c[T0], x3 = c[T0+1] || 0;
    const a = (x1 + x3 - 2*x2) / 2;
    const b = (x3 - x1) / 2;
    if (a !== 0) T0 = T0 - b / (2*a);

    const f = sr / T0;
    if (!isFinite(f) || f < 40 || f > 2000) return -1;
    return f;
}

function applyNeedle(angle, inTune) {
    needle.style.transform = `translateX(-50%) rotate(${angle.toFixed(1)}deg)`;
    needle.classList.toggle('in-tune', inTune);
}

function idleUI(msg = 'Нажмите на микрофон, чтобы начать') {
    noteName.textContent = '—';
    noteName.className = 'note-name idle';
    noteSub.textContent = msg;
    noteSub.classList.remove('in-tune');
    inTuneBadge.classList.remove('visible');
    needleAngle = 0;
    applyNeedle(0, false);
}

function tuneLoop() {
    if (!tunerOn) return;
    tunerRaf = requestAnimationFrame(tuneLoop);

    const now = performance.now();
    if (now - lastAnalysis < 50) return;
    lastAnalysis = now;

    tunerAn.getFloatTimeDomainData(tunerBuf);
    const lvl = rms(tunerBuf);

    if (lvl < 0.008) {
        noteName.textContent = '—';
        noteName.className = 'note-name idle';
        noteSub.textContent = 'Играйте ноту…';
        noteSub.classList.remove('in-tune');
        inTuneBadge.classList.remove('visible');
        needleAngle *= 0.75;
        applyNeedle(needleAngle, false);
        return;
    }

    const f = autoCorrelate(tunerBuf, audioCtx.sampleRate);
    if (f <= 0) {
        noteSub.textContent = 'Идёт поиск высоты…';
        noteSub.classList.remove('in-tune');
        inTuneBadge.classList.remove('visible');
        needleAngle *= 0.75;
        applyNeedle(needleAngle, false);
        return;
    }

    const info = noteFromPitch(f);
    const inTune = Math.abs(info.cents) <= IN_TUNE_CENTS;
    const sign = info.cents >= 0 ? '+' : '';

    noteName.textContent = info.label;
    noteName.className = 'note-name' + (inTune ? ' in-tune' : '');
    noteSub.textContent = `${f.toFixed(1)} Гц · ${sign}${info.cents.toFixed(0)} ¢`;
    noteSub.classList.toggle('in-tune', inTune);
    inTuneBadge.classList.toggle('visible', inTune);

    const target = Math.max(-45, Math.min(45, info.cents * DEG_PER_CENT));
    needleAngle += (target - needleAngle) * 0.3;
    applyNeedle(needleAngle, inTune);
}

async function startTuner() {
    if (tunerOn) return;
    try {
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        tunerStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        tunerAn = audioCtx.createAnalyser();
        tunerAn.fftSize = 2048;
        tunerBuf = new Float32Array(tunerAn.fftSize);
        tunerSrc = audioCtx.createMediaStreamSource(tunerStream);
        tunerSrc.connect(tunerAn);

        tunerOn = true;
        lastAnalysis = 0;
        micBtn.classList.add('on');
        micText.textContent = 'Микрофон вкл';
        idleUI('Играйте ноту…');
        tuneLoop();
    } catch (e) {
        console.error(e);
        micBtn.classList.remove('on');
        micText.textContent = 'Нет доступа';
        idleUI('Разрешите доступ к микрофону');
    }
}

function stopTuner() {
    tunerOn = false;
    if (tunerRaf) cancelAnimationFrame(tunerRaf);
    tunerRaf = null;
    if (tunerSrc) { try { tunerSrc.disconnect(); } catch(e){} tunerSrc = null; }
    if (tunerStream) { tunerStream.getTracks().forEach(t => t.stop()); tunerStream = null; }
    tunerAn = null; tunerBuf = null;
    micBtn.classList.remove('on');
    micText.textContent = 'Микрофон выкл';
    idleUI();
}

micBtn.addEventListener('click', () => {
    if (tunerOn) stopTuner(); else startTuner();
});

/* ==================== ВКЛАДКИ ==================== */
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        const name = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(name + 'Panel').classList.add('active');
        document.getElementById('tabs').dataset.active = name;

        if (name === 'metronome' && tunerOn) stopTuner();
        if (name === 'tuner' && isPlaying) stopMetro();
    });
});

/* ==================== ИНИЦИАЛИЗАЦИЯ ==================== */
(function init() {
    // BPM
    const savedBpm = parseInt(localStorage.getItem('musicToolBPM'));
    if (savedBpm >= BPM_MIN && savedBpm <= BPM_MAX) {
        currentBpm = savedBpm;
        bpmInput.value = savedBpm;
    }

    // Скин
    const savedSkin = parseInt(localStorage.getItem('musicToolSkin'));
    if (savedSkin >= 0 && savedSkin < SKINS.length) skinIdx = savedSkin;
    const c = SKINS[skinIdx];
    pulseCircle.style.background =
        `radial-gradient(circle at 35% 30%, ${lighten(c, 25)}, ${c} 60%, ${darken(c, 20)})`;
    pulseRing.style.borderColor = c;

    // Стрик
    const savedStreak = localStorage.getItem('musicToolStreakSetting');
    if (savedStreak !== null) streakToggle.checked = savedStreak === 'true';
    loadStreak();

    // Звёзды
    const stars = $('stars');
    for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top  = Math.random() * 100 + 'vh';
        s.style.animationDelay = (Math.random() * 6) + 's';
        s.style.animationDuration = (3 + Math.random() * 4) + 's';
        const sz = Math.random() * 1.5 + 1;
        s.style.width = sz + 'px';
        s.style.height = sz + 'px';
        stars.appendChild(s);
    }

    idleUI();
})();
</script>
</body>
</html>
